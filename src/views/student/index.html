<!doctype html>
<html lang="cs">
<head>
  <Head title="Můj přehled" />
  <link rel="stylesheet" href="/css/admin-app.css">
  <link rel="stylesheet" href="overview.css">
</head>
<body class="app">
  <StudentTopbar />
  <div class="app-body">
    <StudentSidebar active="overview" />

    <main class="app-main">
      <header class="app-head">
        <h1>Můj přehled</h1>
      </header>

      <section class="stats" aria-label="Údaje o studentovi">
        <div class="stat"><span class="stat-label">Jméno</span><strong id="s-name">…</strong></div>
        <div class="stat"><span class="stat-label">Číslo studenta</span><strong id="s-number">…</strong></div>
        <div class="stat stat-credits"><span class="stat-label">Kredity</span><strong id="s-credits">…</strong><small>1 kredit = 1 lekce</small></div>
      </section>

      <section class="card" id="progress-card">
        <div class="card-head"><h2>Postup v kurzu</h2></div>
        <div class="card-body">
          <div class="hero">
            <div class="level-badge" id="badge">…</div>
            <div class="hero-main">
              <small id="level-no"></small>
              <h3 id="level-title"></h3>
              <div class="xpbar" id="bar" role="progressbar" aria-label="Postup v aktuálním levelu" aria-valuemin="0" aria-valuemax="100"><div id="bar-fill"></div></div>
              <p id="bar-text" class="hint"></p>
              <p id="hint" class="hint"></p>
              <p><strong id="xp"></strong></p>
            </div>
          </div>
        </div>
      </section>

      <section class="card" id="levels-card">
        <div class="card-head"><h2>Přehled úrovní</h2></div>
        <div class="card-body" id="levels"></div>
      </section>
      <section class="card" id="no-levels" hidden>
        <p class="empty-note">Máš vlastní plán výuky, úrovně se u tebe nesledují.</p>
      </section>
    </main>
  </div>

  <script src="overview.js"></script>
</body>
</html>
