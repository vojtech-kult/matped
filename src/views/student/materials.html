<!doctype html>
<html lang="cs">
<head>
  <Head title="Výukové materiály" />
  <link rel="stylesheet" href="/css/admin-app.css">
  <link rel="stylesheet" href="materials.css">
</head>
<body class="app">
  <StudentTopbar />
  <div class="app-body">
    <StudentSidebar active="materials" />

    <main class="app-main">
      <header class="app-head">
        <h1>Výukové materiály</h1>
      </header>

      <section id="summary" class="card" hidden>
        <div class="card-body mat-summary">
          <div class="mat-summary-main">
            <strong id="sum-text"></strong>
            <div class="mat-bar" aria-hidden="true"><div id="sum-bar"></div></div>
          </div>
          <div class="seg" id="filter" role="group" aria-label="Filtr videí">
            <button type="button" data-filter="all" aria-pressed="true">Všechna</button>
            <button type="button" data-filter="todo" aria-pressed="false">Nezhlédnutá</button>
            <button type="button" data-filter="help" aria-pressed="false">Potřebuji dovysvětlit</button>
          </div>
        </div>
      </section>

      <div id="levels"></div>
      <section id="empty" class="card" hidden>
        <p class="empty-note" id="empty-text"></p>
      </section>
    </main>
  </div>

  <dialog id="ask-dialog" class="modal" aria-labelledby="ask-title">
    <form id="ask-form" class="modal-box form-stack" novalidate>
      <h2 id="ask-title">Co vám nebylo jasné?</h2>
      <p class="hint" id="ask-video" style="margin:0"></p>
      <label class="field">
        <span>Napište nám, s čím byste potřebovali pomoct</span>
        <textarea id="ask-message" rows="5" maxlength="1000" required placeholder="Např. nechápu, proč se při dělení záporným číslem obrací nerovnost…"></textarea>
      </label>
      <div class="flash" id="ask-error" role="alert"></div>
      <div class="row" style="justify-content:flex-end">
        <button type="button" class="btn" id="ask-cancel">Zavřít</button>
        <button type="submit" class="btn btn-primary" id="ask-send">Odeslat</button>
      </div>
    </form>
  </dialog>

  <script src="materials.js"></script>
</body>
</html>
