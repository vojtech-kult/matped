<!doctype html>
<html lang="cs">
<head>
  <Head title="Můj postup" />
  <link rel="stylesheet" href="progress.css">
</head>
<body>
  <StudentNavbar active="progress" />

  <main class="container page">
    <header class="page-head">
      <h1>Můj postup</h1>
      <p class="lead">Aktuální úroveň a přehled toho, co vás v kurzu čeká.</p>
    </header>
    <div id="message" role="alert" class="flash"></div>

    <section class="hero">
      <div class="level-badge" id="badge"></div>
      <div class="hero-main">
        <small id="level-no"></small>
        <h2 id="level-title"></h2>
        <div class="xpbar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div id="bar-fill"></div>
        </div>
        <p id="bar-text"></p>
        <p id="hint"></p>
        <p><strong id="xp"></strong></p>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-title">Přehled úrovní</h2>
      <div class="panel-body">
        <div id="levels"></div>
      </div>
    </section>
  </main>

  <AppFooter />
  <script src="progress.js"></script>
</body>
</html>
